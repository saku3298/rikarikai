<script>(()=>{const tabs=[...document.querySelectorAll('.jp-tab')],panels=[...document.querySelectorAll('.jp-panel')];function openTab(id,hash=true){if(!panels.some(p=>p.id===id))id='episodes';tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===id));panels.forEach(p=>p.classList.toggle('active',p.id===id));if(hash)history.replaceState(null,'',id==='episodes'?location.pathname:'#'+id)}tabs.forEach(t=>t.addEventListener('click',()=>openTab(t.dataset.tab)));openTab(location.hash.slice(1)||'episodes',false);addEventListener('hashchange',()=>openTab(location.hash.slice(1)||'episodes',false))})();</script></body></html>
